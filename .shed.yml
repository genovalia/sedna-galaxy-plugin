name: sedna_fetch
owner: svissault
description: Loads the sample sheet (TSV) and every VCF of a Sedna dataset into a Galaxy history.
homepage_url: https://sedna.apps.genovalia.ulaval.ca/en
long_description: >
  Calls the Sedna API (data-explorer) to fetch the sample sheet and every available VCF of a dataset,
  using the user's Keycloak token; dataset access rights are those of their account. Without a token,
  only public datasets from the catalogue are listed.
categories:
  - Data Source
  - Sequence Analysis
remote_repository_url: https://github.com/genovalia/sedna-galaxy-plugin
type: unrestricted

name: Contract tests

# Checks the public Sedna and metadata-api endpoints the plugin reads, every day.
on:
  schedule:
    - cron: "0 11 * * *"  # 11:00 UTC, every day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_contracts.py

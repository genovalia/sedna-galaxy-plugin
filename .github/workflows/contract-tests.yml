name: Contract tests

# Checks the public Sedna and metadata-api endpoints the plugin reads, every day.
on:
  schedule:
    - cron: "0 11 * * *"  # 11:00 UTC, every day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_contracts.py

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: "github-ci"
            text: ":x: *${{ github.event.repository.name }}* — `${{ github.workflow }}` failed (${{ github.event_name }}, ${{ github.ref_name }}) (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|logs>)"
